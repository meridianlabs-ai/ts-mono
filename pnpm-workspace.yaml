packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

# Require a 7-day soak before pnpm will resolve a newly published version.
# Mitigates supply-chain attacks where a compromised release is detected and
# yanked within days. pnpm 11 enables a 1-day floor by default; this is
# stricter and aligns with current public guidance.
minimumReleaseAge: 10080

# eslint-plugin-react and eslint-plugin-jsx-a11y work with eslint 10 but
# haven't published releases declaring ^10 peer support yet; drop these rules
# when they do. openapi-typescript declares typescript ^5.x and the repo-wide
# typescript is the 6.x preview alias (@typescript/typescript6); drop that
# rule once it declares ^6 support.
peerDependencyRules:
  allowedVersions:
    "eslint-plugin-react>eslint": ^10.0.0
    "eslint-plugin-jsx-a11y>eslint": ^10.0.0
    "openapi-typescript>typescript": ^6.0.0

# Entries below are advisory pins: they force a transitive dependency onto a
# patched release. A pin goes inert once every consumer's own range clears it,
# and it can invert, holding the tree back on a stale release after its
# consumer moves on. `pnpm why <pkg>` and the consumers' declared ranges tell
# you which. Removing a still-live pin silently downgrades, and so can
# removing one that only looks inert because the lockfile still holds an old
# consumer, so resolve without it both from scratch and from the lockfile.
overrides:
  # Keeps brace-expansion 1.x out of the tree, so its frequent advisories only
  # need fixes on the 2.x and 5.x lines. eslint-plugin-react,
  # eslint-plugin-jsx-a11y and postcss-url all still ask for minimatch ^3.x;
  # minimatch 5 is the oldest line that keeps the callable CJS export they
  # need while depending on brace-expansion 2.x.
  "minimatch@3": ^5.1.9
  # Patched only on glob 14; its one consumer (storybook's react-docgen
  # plugin) calls just globSync, which 14 kept. minimatch 10 can't follow
  # to 11 the same way: eslint-plugin-import-x imports makeRe, which 11
  # removed.
  "glob@13": ^14.0.2 # GHSA-3g3m-2fjr-6pw4

# All false = same behavior as pnpm 10, which ignored these build scripts (no
# approvals were configured anywhere). Flip one to true only if something
# demonstrably needs its postinstall (esbuild gets binaries via
# optionalDependencies; unrs-resolver has a JS fallback).
allowBuilds:
  # Same shape as esbuild: the native binding arrives via optionalDependencies
  # (@swc/core-<platform>); the postinstall is only a fallback downloader.
  "@swc/core": false
  esbuild: false
  msw: false
  unrs-resolver: false

# style-mod (CodeMirror's style injection) writes a <style> tag into
# documents, which the viewer's CSP blocks; the patch makes it adopt a
# constructed stylesheet there too, as it already does in shadow roots.
# Keyed by name so it covers every version CodeMirror's packages resolve;
# install fails if a bump changes the patched `root.head` branch.
patchedDependencies:
  style-mod: patches/style-mod.patch
