name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check workspace dependency consistency
        run: pnpm manypkg:check

      - name: Check linting
        run: pnpm lint

  suppressions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # Dep-free by design: no pnpm install needed.
      - name: Check suppressions ledger
        run: node scripts/check-suppressions.mjs

      - name: Test the gate script
        run: node --test scripts/check-suppressions.test.mjs

      - name: Comment ledger delta on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git show "origin/$BASE_REF:suppressions.json" > /tmp/base-suppressions.json 2>/dev/null \
            || echo '{}' > /tmp/base-suppressions.json
          body=$(node scripts/suppressions-pr-delta.mjs /tmp/base-suppressions.json suppressions.json)
          # Sticky comment: match on the marker, not --edit-last, so other
          # bot comments on the PR are never clobbered.
          cid=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            -q '.[] | select(.body | startswith("<!-- suppressions-delta -->")) | .id' | head -1)
          if [ -n "$body" ] && [ -n "$cid" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$cid" -f body="$body" > /dev/null
          elif [ -n "$body" ]; then
            gh pr comment "$PR" --body "$body"
          elif [ -n "$cid" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$cid" \
              -f body="$(printf '<!-- suppressions-delta -->\nThis PR no longer changes the suppression ledger.')" > /dev/null
          fi

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check typechecking
        run: pnpm typecheck

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      e2e-apps: ${{ steps.apps.outputs.apps }}
    steps:
      # An app's e2e tests are implicated by any change outside the *other*
      # app (its own code, shared packages, tooling, lockfile, workflows),
      # excluding docs.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            scout:
              - '!apps/inspect/**'
              - '!docs/**'
              - '!**/*.md'
            inspect:
              - '!apps/scout/**'
              - '!docs/**'
              - '!**/*.md'

      - name: Compute affected apps
        id: apps
        env:
          EVENT: ${{ github.event_name }}
          SCOUT: ${{ steps.filter.outputs.scout }}
          INSPECT: ${{ steps.filter.outputs.inspect }}
        run: |
          apps=()
          if [[ "$EVENT" != "pull_request" ]]; then
            apps=(scout inspect)
          else
            if [[ "$SCOUT" == "true" ]]; then apps+=(scout); fi
            if [[ "$INSPECT" == "true" ]]; then apps+=(inspect); fi
          fi
          echo "apps=$(jq -nc '$ARGS.positional' --args -- "${apps[@]}")" >> "$GITHUB_OUTPUT"

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e-apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.e2e-apps) }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(pnpm --filter ./apps/${{ matrix.app }} exec playwright --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter ./apps/${{ matrix.app }} exec playwright install --with-deps chromium

      - name: Install Playwright system deps (on cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter ./apps/${{ matrix.app }} exec playwright install-deps chromium

      - name: Run e2e tests
        # A step timeout SIGINTs Playwright so it finalizes the report and the
        # upload step still runs; the job-level timeout is the backstop.
        timeout-minutes: 15
        run: pnpm --filter ./apps/${{ matrix.app }} e2e

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.app }}
          path: apps/${{ matrix.app }}/playwright-report/
          retention-days: 7

  # Fan-in for branch protection: the required check is named "e2e", but the
  # matrix reports per-app checks whose names (and presence) vary with the
  # paths filter. This job always runs and reports a single stable status.
  e2e-status:
    name: e2e
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check e2e matrix result
        env:
          RESULT: ${{ needs.e2e.result }}
        run: |
          echo "e2e matrix result: $RESULT"
          if [[ "$RESULT" == "success" || "$RESULT" == "skipped" ]]; then
            exit 0
          fi
          exit 1
