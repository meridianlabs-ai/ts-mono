name: Publish React Viewer Lib

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run in dry-run mode (don't actually publish)"
        required: false
        type: boolean
        default: true
      prerelease:
        description: "Publish as pre-release (beta)"
        required: false
        type: boolean
        default: false

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: apps/scout
    permissions:
      contents: read
      id-token: write
    # Release builds restore no cache (decision: Ransom, 2026-09-21): a cache
    # other workflows saved is mutable state outside this job's inputs. Turbo
    # reads and writes its local cache by default, so turn it off here.
    env:
      TURBO_CACHE: "local:,remote:"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Upgrade npm (for Trusted Publishing)
        run: |
          npm i -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Sync version from git tag
        run: npm version from-git --no-git-tag-version

      - name: Bump to prerelease version
        if: ${{ inputs.prerelease }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          TIMESTAMP=$(date +%s)
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          npm version "${NEW_VERSION}-beta.${TIMESTAMP}" --no-git-tag-version

      - name: Run quality checks
        working-directory: .
        run: pnpm check

      - name: Build library for prerelease
        if: ${{ inputs.prerelease }}
        run: pnpm build:lib

      - name: Publish to NPM (dry-run)
        if: ${{ inputs.dry-run }}
        run: npm publish --dry-run --access public ${{ inputs.prerelease && '--tag beta --ignore-scripts' || '' }}

      - name: Publish to NPM
        if: ${{ !inputs.dry-run }}
        run: npm publish --access public ${{ inputs.prerelease && '--tag beta --ignore-scripts' || '' }}
