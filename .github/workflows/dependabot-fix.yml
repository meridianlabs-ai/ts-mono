# Daily scheduled Claude Code run of the dependabot-fix skill
# (.agents/skills/dependabot-fix/SKILL.md): clear open dependabot alerts via
# pnpm overrides, one PR per batch.
#
# Standalone (not the agents-repo reusable workflow — that one is built around
# issue/comment triggers). Uses claude-code-action automation mode (`prompt`).
# Model auth is Workload Identity Federation (same IDs as
# meridianlabs-ai/agents claude.yml); requires id-token: write.
#
# Three jobs, split so that the job that runs the agent holds no GitHub write
# credential (credential separation, Phase 2; the landing shape is
# meridianlabs-ai/agents design/architecture.md → "Landing job"):
#
#   gate  (trusted)   mints a one-hour GitHub App token that can only read
#                     this repo's Dependabot alerts, reads them, and runs
#                     scripts/dependabot-fix-continuation.mjs --select-only to
#                     name the branch this run lands on: the still-open batch
#                     PR's branch, or a fresh dependabot-fix/<date>. Both are
#                     job outputs; nothing is checked out beyond the script.
#   agent (untrusted) checks out and merges the branch the gate named, then
#                     runs the agent with the job token ONLY (contents: read,
#                     no gh writes, no push). It receives the alert list as a
#                     file, edits the tree, commits locally and writes the PR
#                     title/body as files; `emit-landing` packages the commits
#                     and a manifest for the land job.
#   land  (trusted)   a fresh runner that checks out nothing: mints an App
#                     token for this repo (contents + pull requests), validates
#                     the manifest, pushes the batch branch, opens the PR (or,
#                     on a continued batch, updates the open PR's body).
#
# GitHub identity is the org's GitHub App, meridian-marvin[bot], minted per
# job with actions/create-github-app-token from the org secrets
# MARVIN_APP_CLIENT_ID / MARVIN_APP_PRIVATE_KEY and scoped to this repo and
# to what that job does: `gate` gets Dependabot alerts read (the API has no
# workflow permission key, and the job token cannot read it), `land` gets
# contents + pull requests write (a GITHUB_TOKEN-authored PR triggers no CI —
# GitHub's recursion guard — an App-authored one does). Tokens are revoked at
# job end; the agent job never sees the private key or a minted token. The
# preflight in `gate` fails loudly if the App cannot read the alerts.
#
# SECURITY MODEL — read before editing.
#
# The agent runs pnpm install / check / build / test on the checkout, and
# whatever it commits is pushed as the App by `land`, so the checkout must
# only ever contain this repository's own code. Fork PRs are accepted here
# (ci.yaml runs them under the read-only GITHUB_TOKEN), so the skill's
# "continue the open batch PR" step must never select one. The workflow,
# not the agent, picks that branch, via
# scripts/dependabot-fix-continuation.mjs in the gate job — the selection
# rule and its rationale live in that script's header — and the agent job
# checks it out before the agent starts. The agent is told the result and
# instructed not to touch any other ref. The land job pins the manifest's
# branch to the gate's choice (the open PR's live head ref, or exactly the
# fresh branch name), so a tampered artifact cannot steer the push.
#
# The permission allowlist below is defense in depth, not a boundary:
# `Bash(pnpm:*)` is arbitrary execution and `gh api` is general-purpose.
# It still omits the direct routes — no `git fetch`, no bare `git
# checkout`/`git switch` (only the merge-conflict forms), no `gh pr
# checkout` (gh is allowed per subcommand) — and, since the agent holds no
# write credential, no `git push`, `gh pr create` or `gh pr edit` either.
# Do NOT "fix" a stuck run by re-allowing those or by letting the agent
# pick the PR itself.

name: Dependabot Fix

on:
  schedule:
    - cron: "0 10 * * *" # 6am EDT / 5am EST (cron is UTC-only)
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Run preflight and the continuation-branch selection only; skip the
          agent and the landing. Use to verify the selection logic against
          the repo's current open PRs without spending a model run.
        type: boolean
        default: false

concurrency:
  group: dependabot-fix
  cancel-in-progress: false

jobs:
  # TRUSTED: reads the alerts with the App token and decides the branch. No
  # untrusted code runs here (the checkout is this repo's default branch,
  # only for the selection script and its `git ls-remote`).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout for the selection script
      pull-requests: read # the selection script's `gh pr list` (job token)
    outputs:
      alerts: ${{ steps.alerts.outputs.alerts }}
      branch: ${{ steps.continuation.outputs.branch }}
      continuing: ${{ steps.continuation.outputs.continuing }}
      pr_number: ${{ steps.continuation.outputs.pr_number }}
      pr_url: ${{ steps.continuation.outputs.pr_url }}
    steps:
      # One-hour installation token scoped to this repo and to the one read
      # this job needs. `schedule` events carry no `repository` payload, so
      # the repo is named literally. (Dependabot alerts is the
      # `vulnerability_alerts` permission in the App API.)
      - name: Mint the App token
        id: mint
        uses: actions/create-github-app-token@v2
        with:
          # `app-id` takes the App ID or the Client ID; the action has no client-id input.
          app-id: ${{ secrets.MARVIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.MARVIN_APP_PRIVATE_KEY }}
          owner: meridianlabs-ai
          repositories: ts-mono
          permission-vulnerability-alerts: read

      # Preflight, then the batch: the open alerts, reduced to the fields the
      # skill's step 1 lists, as ONE compact JSON array. The agent job writes
      # it to a file for the agent, which cannot read the alerts API itself.
      - name: Read the open dependabot alerts
        id: alerts
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$REPO/dependabot/alerts?per_page=1" --silent; then
            echo "::error::The App token cannot read dependabot alerts on $REPO — check that the meridian-marvin App is installed on this repo with 'Dependabot alerts: read'."
            exit 1
          fi
          alerts=$(gh api --paginate --slurp "repos/$REPO/dependabot/alerts?state=open&per_page=100" \
            | jq -c '[.[][] | select(.state == "open") | {
                number,
                package: .dependency.package.name,
                ecosystem: .dependency.package.ecosystem,
                manifest: .dependency.manifest_path,
                severity: .security_advisory.severity,
                vulnerable: .security_vulnerability.vulnerable_version_range,
                patched: .security_vulnerability.first_patched_version.identifier,
                ghsa: .security_advisory.ghsa_id,
                summary: .security_advisory.summary}]')
          echo "alerts=$alerts" >>"$GITHUB_OUTPUT"
          count=$(jq 'length' <<<"$alerts")
          echo "Open dependabot alerts: $count"
          echo "- open dependabot alerts: $count" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7

      # Trusted code decides which branch the run lands on (see the security
      # model above). Select only: the agent job does the checkout and the
      # merge. Reads PRs with the job token; the App token above cannot.
      - name: Select the batch branch
        id: continuation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/dependabot-fix-continuation.mjs --select-only

  # UNTRUSTED: this job references no secret and holds the job token only.
  # id-token is the Anthropic WIF OIDC exchange.
  agent:
    needs: gate
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      # Commit identity for the merge below and the agent's own commits: the
      # App token pushes them, so they carry the App's bot identity.
      GIT_AUTHOR_NAME: meridian-marvin[bot]
      GIT_AUTHOR_EMAIL: 330132053+meridian-marvin[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: meridian-marvin[bot]
      GIT_COMMITTER_EMAIL: 330132053+meridian-marvin[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: meridianlabs-ai/agents/.github/actions/assert-no-persisted-credential@main

      # The branch the gate named: an open batch PR's branch, checked out and
      # with the default branch merged in (conflicts are left for the agent),
      # or a fresh branch off the default branch. `sha` is the tip on origin
      # the landing manifest is anchored to — the merge commit and the
      # agent's commits above it are what the land job pushes. The alert list
      # goes to a file in the agent's I/O directory, next to where it writes
      # the PR text.
      - name: Check out the batch branch
        id: base
        env:
          BRANCH: ${{ needs.gate.outputs.branch }}
          CONTINUING: ${{ needs.gate.outputs.continuing }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          ALERTS: ${{ needs.gate.outputs.alerts }}
          IO: ${{ runner.temp }}/agent-io
          # Step-scoped read credential for the fetch (checkout persisted
          # none), as the landing smoke test does.
          GIT_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: credential.${{ github.server_url }}.helper
          GIT_CONFIG_VALUE_1: '!f() { echo username=x-access-token; echo "password=$GIT_TOKEN"; }; f'
        run: |
          set -euo pipefail
          conflicts=false
          if [ "$CONTINUING" = "true" ]; then
            git fetch --quiet --no-tags origin "$BRANCH" "$DEFAULT_BRANCH"
            git checkout --quiet -B "$BRANCH" "origin/$BRANCH"
            sha=$(git rev-parse HEAD)
            # Exit 1 is conflicts (left in the worktree for the agent);
            # anything else is a real error.
            rc=0
            git merge --no-edit "origin/$DEFAULT_BRANCH" || rc=$?
            case "$rc" in
              0) ;;
              1) conflicts=true ;;
              *) exit "$rc" ;;
            esac
          else
            git checkout --quiet -b "$BRANCH"
            sha=$(git rev-parse HEAD)
          fi
          mkdir -p "$IO"
          printf '%s\n' "$ALERTS" >"$IO/alerts.json"
          {
            echo "sha=$sha"
            echo "merge_conflicts=$conflicts"
          } >>"$GITHUB_OUTPUT"
          echo "Batch branch $BRANCH (continuing: $CONTINUING) at $sha; merge conflicts: $conflicts"

      - uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      # Pre-install so the agent's pnpm why/audit/check/build/test work
      # immediately (and hit the pnpm store cache). Only on a fresh checkout
      # of the default branch: a just-merged continuation branch can be
      # textually clean yet fail --frozen-lockfile, and the agent runs
      # `pnpm install` as its first verify step anyway.
      - name: Install dependencies
        if: needs.gate.outputs.continuing != 'true'
        run: pnpm install --frozen-lockfile

      # The job token is passed explicitly so the action does not mint its
      # own App token: `gh` here can read (advisories, PR list/view) and
      # nothing else. --add-dir lets the agent read the alert list and write
      # the PR text in the I/O directory.
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          anthropic_federation_rule_id: fdrl_01GpNgJm9jE6ZfvcqoJYQL2Y
          anthropic_organization_id: be5d0086-bc43-45d2-9184-20ecdd647aa7
          anthropic_service_account_id: svac_01RL4wYD7ikbypwYKf4wFojv
          anthropic_workspace_id: wrkspc_01RKCQ5DTPBatQ7kHLkaEueD
          github_token: ${{ github.token }}
          # Default-deny: headless runs auto-deny anything not allowed. gh per
          # subcommand (advisory API, PR list/view — not `gh pr checkout`, and
          # no create/edit: this job cannot write), pnpm for the verify loop,
          # git scoped to add/commit plus the forms needed to finish or back
          # out the merge the workflow started, and read-only subcommands (no
          # fetch, no checkout/switch/branch creation, no push: the workflow
          # already put the right branch in place and the land job pushes),
          # echo for the GITHUB_STEP_SUMMARY line.
          settings: |
            {"permissions":{"allow":["Read","Edit","Write",
            "Bash(pnpm:*)","Bash(grep:*)","Bash(echo:*)",
            "Bash(gh api:*)","Bash(gh pr list:*)","Bash(gh pr view:*)",
            "Bash(git checkout --ours:*)","Bash(git checkout --theirs:*)",
            "Bash(git merge --continue)","Bash(git merge --abort)",
            "Bash(git branch:*)","Bash(git status:*)","Bash(git log:*)",
            "Bash(git diff:*)","Bash(git show:*)","Bash(git rev-parse:*)",
            "Bash(git remote:*)","Bash(git add:*)","Bash(git commit:*)",
            "Bash(git config:*)"]}}
          claude_args: >-
            --model fable
            --fallback-model default
            --add-dir ${{ runner.temp }}/agent-io
          prompt: |
            Run the dependabot-fix skill (.agents/skills/dependabot-fix/SKILL.md)
            to clear the currently open GitHub dependabot security alerts.

            This is an unattended scheduled run — follow the skill's
            "Unattended runs" rules.

            Your GitHub token is read-only: `gh` works for reads (advisories,
            PR list/view), but you cannot read the alerts API, push, open or
            edit a PR, and must not try. The workflow read the open alerts for
            you: ${{ runner.temp }}/agent-io/alerts.json (a JSON array with
            the fields the skill's step 1 lists). Do not run the skill's
            step 1 command.

            The workflow has already run the skill's step 5 continuation
            script and checked out the branch this run lands on — do not run
            the script again, and do not create, switch or check out any
            other branch. Its result:
            - Branch: ${{ needs.gate.outputs.branch }} (already checked out)
            - Continuing an open batch PR: ${{ needs.gate.outputs.continuing }}
            - Continuation PR: ${{ needs.gate.outputs.pr_url || 'none' }} (number: ${{ needs.gate.outputs.pr_number || 'n/a' }})
            - Merging the default branch left conflicts: ${{ steps.base.outputs.merge_conflicts }}
            If a PR is being continued the default branch is already merged
            in; if conflicts is true, resolve them first (pnpm-workspace.yaml
            overrides, pnpm-lock.yaml) and commit. Follow step 5's rules on
            what not to check out.

            Commit your fixes on the current branch (git add / git commit;
            never push). A trusted job pushes your commits after this job
            ends and opens the PR, or updates the open PR, from two files you
            write in ${{ runner.temp }}/agent-io:
            - pr-title.txt: one line, the PR title (a new batch only).
            - pr-body.md: the full PR body per the skill (one line per alert
              fixed, every deferred alert and why). When continuing a PR,
              write the body for the whole batch — it replaces the open PR's
              body (`gh pr view <number> --json body` shows the current one).
            If nothing is actionable and no open PR needs updating, commit
            nothing and write no PR files.

            Finish every run — including no-op runs — by appending a brief
            status (alerts fixed, alerts deferred, "PR pending" or "no action")
            to the file named by the GITHUB_STEP_SUMMARY environment variable.

      # The action can finish green even when the agent errored (model
      # overload etc.). This job cannot post: the message becomes the
      # manifest's `error` (fail_run true) and the land job posts it on the
      # PR and fails the run after everything else landed. Exits 0 on every
      # path: the red X is the land job's.
      - name: Surface agent errors
        if: always()
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          ERROR_FILE: ${{ runner.temp }}/agent-error.md
        run: |
          set -uo pipefail
          file="${EXEC:-/home/runner/work/_temp/claude-execution-output.json}"
          err=""
          # SDK error results (error_max_turns, error_during_execution, ...)
          # carry no .result field — fall back to .subtype.
          [ -f "$file" ] && err=$(jq -r '(if type=="array" then . else .messages end) | map(select(.type=="result" and .is_error==true)) | last | (.result // .subtype) // empty' "$file" 2>/dev/null || true)
          if [ -z "$err" ] && [ "$CLAUDE_OUTCOME" != "success" ]; then
            err="the Claude Code step ended with outcome '$CLAUDE_OUTCOME' before producing a result (see the job logs)."
          fi
          [ -z "$err" ] && { echo "No agent error detected."; exit 0; }
          echo "::error::Claude run did not complete: $err"
          printf 'The dependabot-fix agent errored before finishing:\n\n> %s\n\nUsually transient (model API capacity/overload or a model-availability blip); if it persists see https://status.claude.com.\n' "$err" >"$ERROR_FILE"

      # Everything the land job pushes and posts, as ONE JSON object for
      # emit-landing's manifest-extra (schema: agents
      # .github/actions/emit-landing/README.md). The agent's files are DATA:
      # copied (capped under the validator's 64 KiB file limit) and referenced
      # by name, never interpolated into a command. A run that committed
      # nothing is a legitimate no-op (nothing actionable), not an error.
      # Fields:
      #   pr     — a new batch only: open the PR for the branch; title from
      #            pr-title.txt (first line, control characters stripped)
      #   error  — the Surface step's message, an unresolved merge, or a
      #            missing PR body; fail_run true
      # On a continued batch the manifest names no PR change (the land
      # composite pushes to the pinned PR's branch); pr-body.md rides along
      # in the artifact for the land job's "Update the batch PR body" step.
      - name: Compose landing manifest
        if: always()
        env:
          DIR: ${{ runner.temp }}/landing
          IO: ${{ runner.temp }}/agent-io
          EXTRA: ${{ runner.temp }}/landing-extra.json
          START: ${{ steps.base.outputs.sha }}
          CONTINUING: ${{ needs.gate.outputs.continuing }}
          ERROR_FILE: ${{ runner.temp }}/agent-error.md
        run: |
          set -euo pipefail
          mkdir -p "$DIR"
          extra='{}'
          err=""
          tip=$(git rev-parse HEAD 2>/dev/null || echo "$START")
          if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
            err="The merge of the default branch into the batch branch was left unfinished, so nothing was landed."
          fi
          if [ -n "$START" ] && [ "$tip" != "$START" ]; then
            if [ -s "$IO/pr-body.md" ]; then
              head -c 60000 "$IO/pr-body.md" >"$DIR/pr-body.md"
            else
              err="${err:+$err }The agent committed changes but wrote no pr-body.md; the PR body is a placeholder."
              printf 'Dependabot fix batch — the agent wrote no PR body; see the workflow run log.\n' >"$DIR/pr-body.md"
            fi
            if [ "$CONTINUING" != "true" ]; then
              title=$( { head -n1 "$IO/pr-title.txt" 2>/dev/null || true; } | tr -d '\000-\037\177' | head -c 200)
              [ -n "$title" ] || title="chore(deps): fix dependabot alerts"
              extra=$(jq -c --arg t "$title" '.pr = {open: true, title: $t, body_file: "pr-body.md"}' <<<"$extra")
            fi
          else
            echo "landing: no commits above $START; nothing to push."
          fi
          if [ -s "$ERROR_FILE" ]; then
            err=$(printf '%s%s' "$(cat "$ERROR_FILE")" "${err:+$(printf '\n\n%s' "$err")}")
          fi
          if [ -n "$err" ]; then
            msg=$(printf '⚠️ The scheduled dependabot-fix run did not complete.\n\n%s' "$err")
            extra=$(jq -c --arg msg "$msg" '.error = {message: $msg, fail_run: true}' <<<"$extra")
          fi
          printf '%s\n' "$extra" >"$EXTRA"
          echo "landing: $(jq -c 'if .error then .error.message = "<\(.error.message | length) chars>" else . end' <<<"$extra")"

      # Last, always: package the commits above the start SHA and the manifest
      # for the land job. This action holds no token.
      - name: Emit landing manifest
        if: always()
        uses: meridianlabs-ai/agents/.github/actions/emit-landing@main
        with:
          start-sha: ${{ steps.base.outputs.sha }}
          branch: ${{ needs.gate.outputs.branch }}
          # The SAME value the land job gets (a gate output, computed before
          # any untrusted code ran): the validator pins the manifest's
          # pr_number to it, and on a continued batch the branch to that
          # PR's live head ref.
          pr-number: ${{ needs.gate.outputs.pr_number }}
          manifest-extra: ${{ runner.temp }}/landing-extra.json

  # TRUSTED, last: a fresh runner that checks out nothing and installs
  # nothing. Runs whatever the agent job did (always()), so an agent failure
  # is reported instead of dying in the log; skipped on a dry run or when the
  # gate failed.
  land:
    needs: [gate, agent]
    if: always() && inputs.dry_run != true && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # fetch the start SHA (land's read token)
      pull-requests: read # the continued PR's head-ref lookup (read token)
      actions: read # artifact download
    steps:
      # Scoped to this repo and to this job's writes: the push (contents) and
      # the PR — open, or its body on a continued batch (pull requests). Both
      # come from meridian-marvin[bot], so CI runs on the PR.
      - name: Mint the App token
        id: mint
        uses: actions/create-github-app-token@v2
        with:
          # `app-id` takes the App ID or the Client ID; the action has no client-id input.
          app-id: ${{ secrets.MARVIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.MARVIN_APP_PRIVATE_KEY }}
          owner: meridianlabs-ai
          repositories: ts-mono
          permission-contents: write
          permission-pull-requests: write

      - name: Land
        id: land
        uses: meridianlabs-ai/agents/.github/actions/land@main
        with:
          token: ${{ steps.mint.outputs.token }}
          # The manifest creates no issues.
          allowed-issue-repos: ""
          # The same value emit-landing got above: on a continued batch the
          # validator pins the manifest's pr_number to it and the branch to
          # that PR's live head ref; the push then updates the open PR.
          pr-number: ${{ needs.gate.outputs.pr_number }}
          # A new batch names no PR to pin the branch to, so the gate's
          # branch name is the pin: the manifest's branch must start with it
          # (here: equal it), as in the agents repo's landing smoke test.
          branch-prefix: ${{ needs.gate.outputs.branch }}

      # The manifest cannot express "replace the open PR's body" (its `pr`
      # block only opens a PR), so on a continued batch the agent's
      # pr-body.md rides along in the landing artifact and is applied here
      # from a separate download, after the composite pushed. Agent text
      # posted as the App: the same de-fang as the composite's lib.sh
      # (triggers lose their `@`, loop markers are split) before it goes out.
      - name: Download the landing artifact for the batch PR body
        if: needs.gate.outputs.continuing == 'true' && steps.land.outputs.pushed == '1'
        uses: actions/download-artifact@v7
        with:
          name: landing
          path: ${{ runner.temp }}/batch-body

      - name: Update the batch PR body
        if: needs.gate.outputs.continuing == 'true' && steps.land.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.gate.outputs.pr_number }}
          SRC: ${{ runner.temp }}/batch-body/pr-body.md
        run: |
          set -euo pipefail
          [ -s "$SRC" ] || { echo "No pr-body.md in the landing; the PR body is unchanged."; exit 0; }
          # shellcheck disable=SC2016 # sed back-references, not shell expansions
          sed -E -e 's/@(review|claude|auto)/`\1`/gI' \
                 -e 's/claude-review-(summary|verdict|comment|nudge)/claude-review \1/gI' \
                 -e 's/auto-(handoff|converged|review-rounds|review-head|fix-attempts)/auto \1/gI' \
                 "$SRC" >"$RUNNER_TEMP/pr-body.md"
          gh pr edit "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/pr-body.md" \
            || { echo "::error::Could not update the body of PR #$PR; the push landed, update the body by hand."; exit 1; }
          echo "Updated the body of PR #$PR."
