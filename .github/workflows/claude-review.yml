# Copy to .github/workflows/claude-review.yml in any Meridian repo to add the
# read-only reviewer. Reviews on demand via an @review comment. Independent of
# the dev agent (claude.yml) — different trigger, different (lower)
# permissions.
#
# ts-mono: automatic review-on-open is deliberately disabled here. The
# upstream template also carries a `pull_request: [opened, reopened,
# ready_for_review]` trigger (with a matching same-repo/non-draft clause in the
# job `if:`); it was removed so PRs are only reviewed when someone asks.
# Re-add that trigger and clause to restore auto-review.
#
# The @review comment path runs as issue_comment in the base-repo context with
# full token access, so it works on fork PRs and drafts too.

name: Review

on:
  issue_comment:
    types: [created]

jobs:
  review:
    # Run on a PR comment containing @review (works on drafts and fork PRs),
    # or on an External-labeled issue comment containing @review. `@review`
    # does not collide with the dev agent's `@claude` trigger.
    # The two exclusions on each branch keep the reviewer's own comments from
    # re-triggering it: a review summary that mentions the trigger token
    # passes this cheap substring gate and spawns a Review run whose
    # newest-wins concurrency CANCELS the run that posted the summary before
    # it posts the verdict marker, so the loop never engages (agents#37). A
    # backticked token is skipped deterministically (the reusable's
    # word-boundary trig gate is blind to it anyway); the
    # claude-review-comment marker the reviewer stamps on every top-level
    # comment covers bare non-word-boundary mentions. Cost: a comment carrying
    # either alongside a genuine bare trigger is wrongly skipped — rare, and
    # recoverable by re-commenting the bare token alone.
    if: >
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@review') &&
       !contains(github.event.comment.body, '`@review`') &&
       !contains(github.event.comment.body, '<!-- claude-review-comment -->')) ||
      (github.event.issue.pull_request == null &&
       contains(github.event.issue.labels.*.name, 'External') &&
       contains(github.event.comment.body, '@review') &&
       !contains(github.event.comment.body, '`@review`') &&
       !contains(github.event.comment.body, '<!-- claude-review-comment -->'))
    uses: meridianlabs-ai/agents/.github/workflows/claude-review.yml@main
    # Machine-account PAT for the deterministic ack/stage steps only (eyes
    # reaction + board stage); never handed to the review agent, which stays
    # read-only. Absent -> those steps no-op.
    secrets:
      MARVIN_TOKEN: ${{ secrets.MARVIN_TOKEN }}
      # codex engine (design/codex-engine.md in the agents repo):
      # consumed only on items labeled engine:codex; optional.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    with:
      # companion branches reference the fork's tracker (mention derivation)
      anchor_repo: meridianlabs-ai/inspect_ai
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
