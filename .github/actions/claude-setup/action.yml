name: claude-setup
description: Provision pnpm + deps for the Claude dev agent
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: pnpm
    - uses: actions/cache@v6
      with:
        path: .turbo
        key: turbo-${{ github.sha }}
        restore-keys: turbo-
    - run: pnpm install --frozen-lockfile
      shell: bash
